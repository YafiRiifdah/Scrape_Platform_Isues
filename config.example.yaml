# Salin ke config.yaml lalu sesuaikan daftar akun.

accounts:
  - platform: instagram
    username: kompascom
    label: Kompas.com
  - platform: instagram
    username: detikcom
    label: detikcom
  - platform: instagram
    username: narasinewsroom
    label: Narasi
  - platform: tiktok
    username: kompascom
    label: Kompas.com
  - platform: tiktok
    username: detikcom
    label: detikcom
  # adapter opsional per akun (default: instaloader untuk instagram, tiktok_apify untuk tiktok):
  #   instaloader | instagram_playwright | tiktok_apify | tiktok_playwright | tiktokapi
  # - platform: instagram
  #   username: tempodotco
  #   label: Tempo
  #   adapter: instagram_playwright

scrape:
  days: 7
  max_comments_per_post: 200
  max_posts_per_account: 100
  delay_between_requests: [2, 6]      # detik, acak di antara dua angka
  delay_between_accounts: [30, 90]
  older_posts_tolerance: 3            # post pinned yang lebih tua sebelum berhenti
  rate_limit_sleep_minutes: 15

analysis:
  # Pilihan 1 (default): Claude lewat API Anthropic, berbayar per token (±$0,35-1,30 per laporan).
  provider: anthropic
  per_post_model: claude-haiku-5-5
  report_model: claude-opus-5-5
  server_side_fallback: true

  # Pilihan 2: penyedia berformat OpenAI-compatible, misalnya tier gratis Gemini/Groq atau Ollama lokal.
  # Hapus tanda # di bawah dan isi LLM_API_KEY di .env (Ollama tidak perlu key).
  # provider: openai_compatible
  # base_url: https://generativelanguage.googleapis.com/v1beta/openai/   # Gemini
  # # base_url: https://api.groq.com/openai/v1                           # Groq
  # # base_url: https://openrouter.ai/api/v1                             # OpenRouter
  # # base_url: http://localhost:11434/v1                                # Ollama lokal
  # api_key_env: LLM_API_KEY
  # per_post_model: gemini-3.8-flash
  # report_model: gemini-3.8-flash
  # request_delay_seconds: 4        # jeda antar panggilan agar tidak kena batas tier gratis
  # reasoning_effort: low            # untuk model berpikir (Gemini 3.x); hapus bila penyedia menolak

  max_comments_to_llm: 200
  top_replied_to_llm: 10
  language: id

storage:
  db_path: data/spi.sqlite
  reports_dir: reports
